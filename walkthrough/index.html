<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gym Lakewood — 3D Walkthrough</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d10'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23f4f1ea' font-family='Arial'%3EG%3C/text%3E%3C/svg%3E">
<style>
  :root { --ink: #f4f1ea; --muted: rgba(244,241,234,.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); }
  #view { display: block; width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 52%, rgba(0,0,0,.72) 100%),
      linear-gradient(to right, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 46%),
      radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 42%, rgba(0,0,0,.46) 100%); }
  .brand { position: fixed; top: 34px; left: 44px; letter-spacing: .42em; font-size: 12px;
    font-weight: 600; text-transform: uppercase; }
  .brand small { display: block; margin-top: 8px; letter-spacing: .24em; font-size: 9.5px;
    font-weight: 400; color: var(--muted); }
  #caption { position: fixed; left: 44px; bottom: 74px; opacity: 0; transition: opacity .12s linear; }
  #label { font-size: 44px; font-weight: 200; letter-spacing: .16em; line-height: 1;
    text-transform: uppercase; text-shadow: 0 2px 26px rgba(0,0,0,.6); }
  #sub { margin-top: 14px; font-size: 12.5px; letter-spacing: .2em; color: var(--muted);
    text-transform: uppercase; }
  #caption .rule { width: 56px; height: 1px; background: rgba(244,241,234,.8); margin: 20px 0 0; }
  #track { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.12); }
  #bar { height: 100%; width: 0; background: rgba(255,255,255,.85); }
  .controls { position: fixed; right: 40px; bottom: 44px; display: flex; gap: 10px;
    pointer-events: auto; opacity: 0; transition: opacity .25s; }
  body:hover .controls { opacity: 1; }
  .controls button, #chapters button { pointer-events: auto; background: rgba(12,14,18,.62);
    border: 1px solid rgba(255,255,255,.18); color: var(--ink); font: inherit; font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; padding: 9px 16px; border-radius: 2px;
    cursor: pointer; backdrop-filter: blur(6px); }
  .controls button:hover, #chapters button:hover { background: rgba(255,255,255,.14); }
  #chapters { position: fixed; left: 44px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 5px; opacity: 0; transition: opacity .25s;
    max-height: 70vh; overflow: auto; }
  body:hover #chapters { opacity: .9; }
  #chapters button { text-align: left; padding: 6px 12px; font-size: 9.5px; }
  body.capture .controls, body.capture #chapters { display: none; }
  @media (max-width: 720px) {
    .brand { top: 20px; left: 20px; }
    #caption { left: 20px; bottom: 56px; }
    #label { font-size: 26px; }
    #chapters { display: none; }
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="vignette"></div>
  <div class="overlay">
    <div class="brand">The Gym<small>Lakewood, NJ · Floor Plan Option 2</small></div>
    <div id="caption">
      <div id="label"></div>
      <div id="sub"></div>
      <div class="rule"></div>
    </div>
    <div id="track"><div id="bar"></div></div>
  </div>
  <div id="chapters"></div>
  <div class="controls">
    <button id="restart">Restart</button>
    <button id="playpause">Pause</button>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
