# One-shot helper: pulls the Higgsfield-generated photography + hero video
# (public CDN links listed in scripts/asset-sources.txt), compresses them to
# web sizes, and commits them to the branch the workflow was dispatched on.
# Needed because the build sandbox that wrote the site can't reach that CDN.
name: Fetch generated assets
on:
  workflow_dispatch:
  push:
    branches: ["claude/premium-scrollcraft-site-2hmotj"]
    paths:
      - scripts/asset-sources.txt
      - scripts/fetch-assets.sh
      - .github/workflows/fetch-assets.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and compress
        run: bash scripts/fetch-assets.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images videos
          git commit -m "Add generated photography and hero video" || echo "nothing to commit"
          git push
