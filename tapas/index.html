<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tapas — Small Plates, Shared Tables</title>
<meta name="description" content="Tapas — small plates meant to be passed around. There’s always something good in tapas." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/hero.css" />
</head>
<body>

<!-- ============ HERO ============ -->
<div class="halide-body">

  <!-- SVG Filter for Grain -->
  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>

  <div class="halide-grain" style="filter:url(#grain)"></div>

  <div class="interface-grid">
    <div style="font-weight:700">TAPAS</div>
    <div class="readout">
      <div>SMALL PLATES · SHARED TABLES</div>
      <div>KITCHEN OPEN TILL LATE</div>
    </div>

    <h1 class="hero-title">THERE&rsquo;S ALWAYS<br />SOMETHING GOOD<br /><em>IN TAPAS</em></h1>

    <div style="grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-end">
      <div style="font-family:monospace;font-size:0.75rem">
        <p>[ THE PLATTER ]</p>
        <p>EVERYTHING ON ONE BOARD, MEANT TO BE PASSED AROUND</p>
      </div>
      <a href="#" class="cta-button">BOOK A TABLE</a>
    </div>
  </div>

  <div class="viewport">
    <div class="canvas-3d" id="canvas3d">
      <div class="layer layer-1" data-layer></div>
      <div class="layer layer-2" data-layer></div>
      <div class="layer layer-3" data-layer></div>
      <div class="contours"></div>
    </div>
  </div>

  <div class="scroll-hint"></div>
</div>

<script src="js/hero.js"></script>
</body>
</html>
